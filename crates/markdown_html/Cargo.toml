[package]
name = "markdown_html"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = { version = "1.9.0", optional = true }
clap = { version = "4.5.26", features = ["derive"] }
http-body-util = { version = "0.1.2", optional = true }
hyper = { version = "1.5.2", features = ["http1", "server"], optional = true }
hyper-util = { version = "0.1.10", features = ["tokio"], optional = true }
lazy_static = "1.5.0"
pulldown-cmark = "0.12.2"
tera = "1.20.0"
tokio = { version = "1.43.0", features = ["macros", "net", "rt-multi-thread"] }

[features]
default = ["serve"]
serve = ["http-body-util", "hyper", "hyper-util", "bytes"]

